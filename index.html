<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Jump — Полный Экран</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body, html {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

        /* Игра теперь занимает честные 100% ширины и высоты смартфона */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #6cbce2;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Верхняя панель адаптивна к "челкам" и вырезам (viewport-fit=cover) */
        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 calc(15px + env(safe-area-inset-left, 0px));
            z-index: 10;
            pointer-events: none;
        }

        .stats {
            background: rgba(44, 30, 18, 0.85);
            padding: 8px 16px;
            border-radius: 20px;
            color: #f9e45b;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        .skin-selector {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 20px;
            pointer-events: auto;
            overflow-x: auto;
            max-width: 60%;
        }

        .skin-btn {
            background: #3d2b1a;
            border: none;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 15px;
            color: #ffec80;
            font-weight: bold;
            white-space: nowrap;
        }

        .skin-btn.active {
            background: #f5b642;
            color: #2c1a0a;
            box-shadow: 0 0 8px gold;
        }

        /* Сенсорная панель управления разнесена по краям дисплея */
        .touch-controls {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            left: 0;
            width: 100%;
            padding: 0 calc(20px + env(safe-area-inset-right, 0px)) 0 calc(20px + env(safe-area-inset-left, 0px));
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }

        .d-pad, .action-pad, .system-pad {
            pointer-events: auto;
        }

        .d-pad {
            display: flex;
            gap: 20px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }

        .system-pad {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .sys-btn {
            background: rgba(40, 40, 40, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .sys-btn.restart { background: rgba(165, 63, 43, 0.8); }

        /* Экран поворота */
        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b2b44;
            color: white;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: portrait) {
            .orientation-warning { display: flex; }
        }
    </style>
</head>
<body>

    <div class="orientation-warning">
        <div style="font-size: 50px;">🔄</div>
        <h2 style="margin-top: 15px;">Пожалуйста, переверните устройство</h2>
        <p>Для игры на весь экран перейдите в альбомный (горизонтальный) режим.</p>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="stats">
                ★ <span id="coinCounter">0</span> | ❤️ <span id="livesCounter">3</span>
            </div>
            <div class="skin-selector" id="skinSelector">
                <button class="skin-btn active" data-skin="5">😎 Д1</button>
                <button class="skin-btn" data-skin="6">⚡ Д2</button>
                <button class="skin-btn" data-skin="7">🕶️ Д3</button>
                <button class="skin-btn" data-skin="8">🕺 Д4</button>
                <button class="skin-btn" data-skin="9">👓 Д5</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="touch-controls">
            <div class="d-pad">
                <div class="ctrl-btn" id="btnLeft">◀</div>
                <div class="ctrl-btn" id="btnRight">▶</div>
            </div>

            <div class="system-pad">
                <button class="sys-btn" id="btnScreenshot">📸 СНИМОК</button>
                <button class="sys-btn restart" id="btnRestart">🔄 СНАЧАЛА</button>
            </div>

            <div class="action-pad">
                <div class="ctrl-btn" id="btnJump" style="width: 80px; height: 80px; background: rgba(245, 182, 66, 0.35); border-color: rgba(245, 182, 66, 0.6);">▲</div>
            </div>
        </div>
    </div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let score = 0;
        let lives = 3;
        let currentSkin = 5; 
        
        // Базовая высота для логики (чтобы на всех экранах прыжки были одинаковой высоты)
        const BASE_HEIGHT = 450;
        let scaleFactor = 1;
        
        const PLAYER_WIDTH = 30;
        const PLAYER_HEIGHT = 30;
        let player = { x: 80, y: 0, vx: 0, vy: 0, width: PLAYER_WIDTH, height: PLAYER_HEIGHT, grounded: false, facingRight: true };
        
        const GRAVITY = 0.8;
        const JUMP_POWER = -11.5;
        const WALK_ACC = 0.9;
        const MAX_SPEED = 5.5;
        const LEVEL_WIDTH = 4000; 
        
        let platforms = [];
        let coins = [];
        let enemies = [];
        let cameraX = 0;
        
        let leftPressed = false;
        let rightPressed = false;
        let jumpKeyPressed = false;
        let canJump = true;

        // Функция адаптивного изменения размера под любой экран без искажений
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Рассчитываем масштаб относительно базовой высоты
            scaleFactor = canvas.height / BASE_HEIGHT;
            buildLevel();
        }
        
        function buildLevel(){
            platforms = [];
            coins = [];
            enemies = [];
            const groundY = BASE_HEIGHT - 48;
            
            // Земля с островками-пропастями
            platforms.push({ x: 0, y: groundY, w: 1000, h: 48, type: 'ground' });
            platforms.push({ x: 1150, y: groundY, w: 900, h: 48, type: 'ground' });
            platforms.push({ x: 2200, y: groundY, w: 1800, h: 48, type: 'ground' });
            
            // Набор платформ (в координатах базовой высоты 450px)
            platforms.push({ x: 200, y: groundY - 50, w: 90, h: 20 });
            platforms.push({ x: 340, y: groundY - 100, w: 90, h: 20 });
            platforms.push({ x: 480, y: groundY - 150, w: 100, h: 20 });
            platforms.push({ x: 650, y: groundY - 100, w: 110, h: 20 });
            platforms.push({ x: 790, y: groundY - 160, w: 80, h: 20 });
            platforms.push({ x: 930, y: groundY - 90, w: 80, h: 20 });

            platforms.push({ x: 1200, y: groundY - 60, w: 100, h: 20 });
            platforms.push({ x: 1350, y: groundY - 120, w: 120, h: 20 });
            platforms.push({ x: 1520, y: groundY - 180, w: 80, h: 20 });
            platforms.push({ x: 1700, y: groundY - 130, w: 110, h: 20 });
            platforms.push({ x: 1880, y: groundY - 70, w: 100, h: 20 });

            platforms.push({ x: 2280, y: groundY - 60, w: 120, h: 20 });
            platforms.push({ x: 2450, y: groundY - 120, w: 90, h: 20 });
            platforms.push({ x: 2600, y: groundY - 180, w: 150, h: 20 }); 
            platforms.push({ x: 2820, y: groundY - 130, w: 100, h: 20 });
            platforms.push({ x: 2980, y: groundY - 80, w: 90, h: 20 });
            platforms.push({ x: 3140, y: groundY - 140, w: 120, h: 20 });
            platforms.push({ x: 3350, y: groundY - 180, w: 80, h: 20 });
            platforms.push({ x: 3500, y: groundY - 110, w: 140, h: 20 }); 
            
            function addCoin(xx, yy){ coins.push({ x: xx, y: yy, w: 14, h: 14, collected: false }); }
            addCoin(230, groundY - 80); addCoin(370, groundY - 130); addCoin(510, groundY - 180);
            addCoin(680, groundY - 130); addCoin(810, groundY - 190); addCoin(1230, groundY - 90);
            addCoin(1380, groundY - 150); addCoin(1540, groundY - 210); addCoin(1730, groundY - 160);
            addCoin(2310, groundY - 90); addCoin(2480, groundY - 150); addCoin(2630, groundY - 210);
            addCoin(2670, groundY - 210); addCoin(2850, groundY - 160); addCoin(3170, groundY - 170);
            addCoin(3530, groundY - 140); addCoin(3570, groundY - 140);

            function addEnemy(xx, yy){ enemies.push({ x: xx, y: yy, w: 28, h: 28, direction: 1, speed: 1.1 }); }
            addEnemy(450, groundY - 28); addEnemy(700, groundY - 128); addEnemy(1400, groundY - 148);
            addEnemy(1750, groundY - 28); addEnemy(2350, groundY - 88); addEnemy(2650, groundY - 208);
            addEnemy(3000, groundY - 28); addEnemy(3200, groundY - 168); addEnemy(3550, groundY - 28);
            
            player.x = 80;
            player.y = platforms[0].y - PLAYER_HEIGHT;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
        }
        
        function applyCollision(){
            player.vy += GRAVITY;
            player.x += player.vx;
            
            for(let plat of platforms){
                if(player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                   player.y + player.height > plat.y && player.y < plat.y + plat.h){
                    if(player.vx > 0) player.x = plat.x - player.width;
                    else if(player.vx < 0) player.x = plat.x + plat.w;
                    if(player.vx !== 0) player.vx = 0;
                }
            }
            
            player.y += player.vy;
            player.grounded = false;
            
            for(let plat of platforms){
                if(player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                   player.y + player.height > plat.y && player.y < plat.y + plat.h){
                    if(player.vy >= 0 && (player.y + player.height - player.vy) <= plat.y + 12){
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } 
                    else if(player.vy < 0){
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    }
                }
            }
            
            if(player.x < 10) player.x = 10;
            if(player.x + player.width > LEVEL_WIDTH - 10) player.x = LEVEL_WIDTH - player.width;
            if(player.y > BASE_HEIGHT + 50) loseLife();
        }
        
        function updateEnemies(){
            for(let i=0; i<enemies.length; i++){
                const e = enemies[i];
                let newX = e.x + e.direction * e.speed;
                
                let willCollide = false;
                for(let plat of platforms){
                    if(newX + e.w > plat.x && newX < plat.x + plat.w &&
                       e.y + e.h > plat.y && e.y < plat.y + plat.h){
                        willCollide = true;
                        break;
                    }
                }
                
                if(willCollide){ e.direction *= -1; newX = e.x + e.direction * e.speed; }
                e.x = newX;
                
                let onGround = false;
                for(let plat of platforms){
                    if(e.x + e.w > plat.x && e.x < plat.x + plat.w &&
                       e.y + e.h >= plat.y && e.y + e.h <= plat.y + 8){
                        onGround = true;
                        break;
                    }
                }
                if(!onGround && e.y + e.h < BASE_HEIGHT - 10) e.direction *= -1;
                
                if(gameRunning && player.x < e.x + e.w && player.x + player.width > e.x &&
                   player.y < e.y + e.h && player.y + player.height > e.y){
                    if(player.vy > 0 && player.y + player.height - player.vy <= e.y + 12){
                        enemies.splice(i,1); i--; player.vy = -8.5; score += 2; updateUI();
                    } else { loseLife(); }
                }
            }
        }
        
        function updateCoins(){
            for(let i=0; i<coins.length; i++){
                const c = coins[i];
                if(!c.collected && player.x < c.x + c.w && player.x + player.width > c.x &&
                   player.y < c.y + c.h && player.y + player.height > c.y){
                    c.collected = true; score++; updateUI();
                }
            }
        }
        
        function loseLife(){
            if(!gameRunning) return;
            lives--; updateUI();
            if(lives <= 0){ gameRunning = false; } 
            else {
                player.x = 80; player.y = platforms[0].y - PLAYER_HEIGHT;
                player.vx = 0; player.vy = 0; player.grounded = true; canJump = true; cameraX = 0;
            }
        }
        
        function restartGame(){
            gameRunning = true; lives = 3; score = 0;
            buildLevel(); updateUI();
            leftPressed = false; rightPressed = false; jumpKeyPressed = false; canJump = true;
        }
        
        function updateUI(){
            document.getElementById('coinCounter').innerText = score;
            document.getElementById('livesCounter').innerText = lives;
        }
        
        function handleInput(){
            if(!gameRunning) return;
            if(leftPressed){ player.vx = Math.max(-MAX_SPEED, player.vx - WALK_ACC); player.facingRight = false; }
            if(rightPressed){ player.vx = Math.min(MAX_SPEED, player.vx + WALK_ACC); player.facingRight = true; }
            if(!leftPressed && !rightPressed){ player.vx *= 0.85; if(Math.abs(player.vx) < 0.05) player.vx = 0; }
            if(jumpKeyPressed && player.grounded && canJump){ player.vy = JUMP_POWER; player.grounded = false; canJump = false; }
        }
        
        function updateCamera(){
            // Логический размер экрана в ширину зависит от пропорций текущего дисплея телефона
            let virtualWidth = canvas.width / scaleFactor;
            let targetX = player.x + player.width/2 - virtualWidth/2;
            targetX = Math.min(targetX, LEVEL_WIDTH - virtualWidth);
            targetX = Math.max(targetX, 0);
            cameraX = targetX;
        }
        
        function drawSkin(ctx, x, y, facingRight, skinId){
            if(skinId === 5){  
                ctx.fillStyle = "#f3ccb0"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#1a1310"; ctx.fillRect(x+2, y-3, PLAYER_WIDTH-4, 8);
                ctx.fillRect(x+3, y+4, 6, 4); ctx.fillRect(x+11, y+4, 12, 3); ctx.fillRect(x+21, y+4, 6, 4);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 11);
                ctx.fillStyle = "#e6e6e6"; ctx.fillRect(x+7, y+16, 16, 3);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+4, y+27, 8, 4); ctx.fillRect(x+18, y+27, 8, 4);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+6, y+9, 5, 4); ctx.fillRect(x+19, y+9, 5, 4);
                ctx.fillStyle = "#1c120c"; ctx.fillRect(x+7+(facingRight?1:-1), y+10, 3, 3); ctx.fillRect(x+20+(facingRight?1:-1), y+10, 3, 3);
                return;
            }
            if(skinId === 6){  
                ctx.fillStyle = "#fcd0b0"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#80593f"; ctx.fillRect(x+1, y-4, PLAYER_WIDTH-2, 9); 
                ctx.fillStyle = "#9c7459"; ctx.fillRect(x+3, y+2, 8, 4); ctx.fillRect(x+13, y+1, 10, 5);
                ctx.fillStyle = "#141416"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+2, y+18, 3, 2); ctx.fillRect(x+14, y+17, 2, 4); ctx.fillRect(x+22, y+20, 5, 2);
                ctx.fillStyle = "#404045"; ctx.fillRect(x+13, y+16, 4, 12);
                ctx.fillStyle = "#0c0c0e"; ctx.fillRect(x+3, y+28, 8, 3); ctx.fillRect(x+19, y+28, 8, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+5, y+9, 5, 4); ctx.fillRect(x+19, y+9, 5, 4);
                ctx.fillStyle = "#467285"; ctx.fillRect(x+6+(facingRight?1:0), y+10, 3, 3); ctx.fillRect(x+20+(facingRight?1:0), y+10, 3, 3);
                return;
            }
            if(skinId === 7){  
                ctx.fillStyle = "#fad1b0"; ctx.fillRect(x+4, y+4, PLAYER_WIDTH-8, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#5c4033"; ctx.fillRect(x+2, y-4, PLAYER_WIDTH-4, 9);
                ctx.fillStyle = "#2b5c8f"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#6ca0dc"; ctx.fillRect(x, y+18, PLAYER_WIDTH, 3); ctx.fillRect(x, y+24, PLAYER_WIDTH, 3);
                ctx.fillStyle = "#151515"; ctx.fillRect(x+4, y+28, 7, 3); ctx.fillRect(x+19, y+28, 7, 3);
                ctx.fillStyle = "#1a1a24"; ctx.fillRect(x+2, y+8, 11, 6); ctx.fillRect(x+17, y+8, 11, 6);
                ctx.fillStyle = "#555"; ctx.fillRect(x+13, y+10, 4, 2);
                return;
            }
            if(skinId === 8){  
                ctx.fillStyle = "#ebd0b9"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+1, y-3, PLAYER_WIDTH-2, 8);
                ctx.fillRect(x+2, y+5, 7, 6); ctx.fillRect(x+21, y+5, 7, 6);
                ctx.fillStyle = "#1c1c1e"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#2c3539"; ctx.fillRect(x+4, y+28, 7, 3); ctx.fillRect(x+19, y+28, 7, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+5, y+10, 5, 4); ctx.fillRect(x+20, y+10, 5, 4);
                ctx.fillStyle = "#221915"; ctx.fillRect(x+6, y+11, 3, 3); ctx.fillRect(x+21, y+11, 3, 3);
                return;
            }
            if(skinId === 9){  
                ctx.fillStyle = "#fcdcb5"; ctx.fillRect(x+2, y+4, PLAYER_WIDTH-4, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#2d2522"; ctx.fillRect(x+1, y-3, PLAYER_WIDTH-2, 8);
                ctx.fillStyle = "#1f2421"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#111"; ctx.fillRect(x+3, y+28, 8, 3); ctx.fillRect(x+19, y+28, 8, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+4, y+9, 8, 6); ctx.fillRect(x+18, y+9, 8, 6);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+6+(facingRight?1:-1), y+11, 3, 3); ctx.fillRect(x+20+(facingRight?1:-1), y+11, 3, 3);
                ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.strokeRect(x+3, y+8, 9, 8); ctx.strokeRect(x+17, y+8, 9, 8);
                ctx.fillStyle = "#000"; ctx.fillRect(x+12, y+11, 6, 2);
                return;
            }
        }
        
        function draw(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Включаем глобальное масштабирование рендера под текущую высоту экрана
            ctx.save();
            ctx.scale(scaleFactor, scaleFactor);
            
            // Небо
            ctx.fillStyle = "#6cbce2"; 
            ctx.fillRect(0, 0, canvas.width / scaleFactor, BASE_HEIGHT);
            
            // Облака
            ctx.fillStyle = "#fcf9ee";
            for(let i=0; i<20; i++){ 
                ctx.fillRect(80 + i * 320 - cameraX * 0.2, 30 + (i % 4) * 25, 80, 35); 
            }
            
            // Платформы
            for(let plat of platforms){
                let dx = plat.x - cameraX;
                if(plat.type === 'ground'){
                    ctx.fillStyle = "#735135"; ctx.fillRect(dx, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#4fa745"; ctx.fillRect(dx, plat.y, plat.w, 7);
                } else {
                    ctx.fillStyle = "#b36b39"; ctx.fillRect(dx, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#ffaa66"; ctx.fillRect(dx, plat.y, plat.w, 4);
                }
            }
            
            // Монеты
            for(let c of coins){
                if(c.collected) continue;
                let dx = c.x - cameraX;
                ctx.fillStyle = "#FFD966"; ctx.beginPath(); ctx.ellipse(dx+7, c.y+7, 7, 7, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#b8860b"; ctx.font = "bold 11px monospace"; ctx.fillText("★", dx+3, c.y+11);
            }
            
            // Враги
            for(let e of enemies){
                let dx = e.x - cameraX;
                ctx.fillStyle = "#a83232"; ctx.fillRect(dx, e.y, 28, 28);
                ctx.fillStyle = "#fff"; ctx.fillRect(dx+4, e.y+6, 6, 6); ctx.fillRect(dx+16, e.y+6, 6, 6);
                ctx.fillStyle = "#000"; ctx.fillRect(dx+6, e.y+8, 3, 3); ctx.fillRect(dx+18, e.y+8, 3, 3);
                ctx.fillRect(dx+8, e.y+18, 12, 3);
            }
            
            // Игрок
            let px = player.x - cameraX; 
            drawSkin(ctx, px, player.y, player.facingRight, currentSkin);
            
            // Финишный флаг
            let fx = LEVEL_WIDTH - 120 - cameraX;
            ctx.fillStyle = "#333"; ctx.fillRect(fx, BASE_HEIGHT - 148, 6, 100);
            ctx.fillStyle = "#ff3333"; ctx.fillRect(fx + 6, BASE_HEIGHT - 148, 35, 22);
            
            // Экран Проигрыша
            if(!gameRunning && lives <= 0){
                let vw = canvas.width / scaleFactor;
                ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, vw, BASE_HEIGHT);
                ctx.font = "bold 28px monospace"; ctx.fillStyle = "#FFD966"; ctx.fillText("ИГРА ОКОНЧЕНА", vw/2 - 110, BASE_HEIGHT/2 - 20);
                ctx.font = "16px monospace"; ctx.fillStyle = "white"; ctx.fillText("Нажмите кнопку 'СНАЧАЛА'", vw/2 - 105, BASE_HEIGHT/2 + 20);
            }
            
            ctx.restore();
        }
        
        function takeScreenshot(){
            const link = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
            link.download = `super_jump_${currentSkin}_${timestamp}.png`;
            link.href = canvas.toDataURL(); link.click();
        }
        
        function gameLoop(){
            if(gameRunning){
                handleInput(); applyCollision(); updateEnemies(); updateCoins(); updateCamera();
                if(player.x >= LEVEL_WIDTH - 140){
                    gameRunning = false;
                    alert(`🎉 КАРТА ПРОЙДЕНА!\nВы собрали: ${score} звёзд.`);
                }
            }
            draw(); requestAnimationFrame(gameLoop);
        }
        
        function init(){
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 200); });
            resizeCanvas(); 
            
            const setupTouchButton = (element, pressCallback, releaseCallback) => {
                element.addEventListener('touchstart', (e) => { pressCallback(); e.preventDefault(); }, {passive: false});
                element.addEventListener('touchend', (e) => { releaseCallback(); e.preventDefault(); }, {passive: false});
                element.addEventListener('mousedown', (e) => { pressCallback(); });
                element.addEventListener('mouseup', () => { releaseCallback(); });
            };

            setupTouchButton(document.getElementById('btnLeft'), () => { leftPressed = true; }, () => { leftPressed = false; });
            setupTouchButton(document.getElementById('btnRight'), () => { rightPressed = true; }, () => { rightPressed = false; });
            setupTouchButton(document.getElementById('btnJump'), () => { jumpKeyPressed = true; }, () => { jumpKeyPressed = false; canJump = true; });

            document.getElementById('btnRestart').addEventListener('click', restartGame);
            document.getElementById('btnScreenshot').addEventListener('click', takeScreenshot);
            
            const skinBtns = document.querySelectorAll('.skin-btn');
            skinBtns.forEach((btn) => {
                const select = (e) => {
                    currentSkin = parseInt(btn.dataset.skin);
                    skinBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if(e) e.preventDefault();
                };
                btn.addEventListener('click', select);
                btn.addEventListener('touchstart', select, {passive: false});
            });
            
            document.addEventListener('keydown', function(e) {
                if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
                if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
                if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') jumpKeyPressed = true;
            });
            document.addEventListener('keyup', function(e) {
                if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
                if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') leftPressed = false;
                if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { jumpKeyPressed = false; canJump = true; }
            });
            
            gameLoop();
        }
        
        init();
    })();
</script>
</body>
</html>
