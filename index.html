<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Jump — Безупречная Версия</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body, html {
            background-color: #111;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #6cbce2;
        }

        canvas {
            display: block;
            width: 100%;
            height: calc(100% - 110px); 
            background: #6cbce2;
        }

        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 calc(15px + env(safe-area-inset-left, 0px));
            z-index: 10;
            pointer-events: none;
        }

        .stats {
            background: rgba(44, 30, 18, 0.85);
            padding: 8px 16px;
            border-radius: 20px;
            color: #f9e45b;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        .skin-selector {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 20px;
            pointer-events: auto;
            overflow-x: auto;
            max-width: 60%;
        }

        .skin-btn {
            background: #3d2b1a;
            border: none;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 15px;
            color: #ffec80;
            font-weight: bold;
            white-space: nowrap;
        }

        .skin-btn.active {
            background: #f5b642;
            color: #2c1a0a;
            box-shadow: 0 0 8px gold;
        }

        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.6));
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding: 0 calc(25px + env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) calc(25px + env(safe-area-inset-left, 0px));
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .d-pad, .action-pad, .system-pad {
            display: flex;
            align-items: center;
        }

        .d-pad { gap: 25px; }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .ctrl-btn:active {
            background: rgba(245, 182, 66, 0.6);
            border-color: #f5b642;
            transform: scale(0.92);
        }

        .system-pad { gap: 12px; }

        .sys-btn {
            background: rgba(60, 60, 60, 0.8);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 11px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: bold;
        }
        
        .sys-btn.restart { background: rgba(185, 53, 33, 0.85); }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b2b44;
            color: white;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: portrait) {
            .orientation-warning { display: flex; }
        }
    </style>
</head>
<body>

    <div class="orientation-warning">
        <div style="font-size: 50px;">🔄</div>
        <h2 style="margin-top: 15px;">Пожалуйста, переверните устройство</h2>
        <p>Для комфортной игры перейдите в горизонтальный режим.</p>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="stats">
                ★ <span id="coinCounter">0</span> | ❤️ <span id="livesCounter">3</span>
            </div>
            <div class="skin-selector" id="skinSelector">
                <button class="skin-btn active" data-skin="5">😎 Д1</button>
                <button class="skin-btn" data-skin="6">⚡ Д2</button>
                <button class="skin-btn" data-skin="7">🕶️ Д3</button>
                <button class="skin-btn" data-skin="8">🕺 Д4</button>
                <button class="skin-btn" data-skin="9">👓 Д5</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="touch-controls">
            <div class="d-pad">
                <div class="ctrl-btn" id="btnLeft">◀</div>
                <div class="ctrl-btn" id="btnRight">▶</div>
            </div>

            <div class="system-pad">
                <button class="sys-btn" id="btnScreenshot">📸 СНИМОК</button>
                <button class="sys-btn restart" id="btnRestart">🔄 СНАЧАЛА</button>
            </div>

            <div class="action-pad">
                <div class="ctrl-btn" id="btnJump" style="width: 85px; height: 85px; font-size: 32px; background: rgba(245, 182, 66, 0.25); border-color: rgba(245, 182, 66, 0.5);">▲</div>
            </div>
        </div>
    </div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let score = 0;
        let lives = 3;
        let currentSkin = 5; 
        
        const BASE_HEIGHT = 400; 
        let scaleFactor = 1;
        
        const PLAYER_WIDTH = 30;
        const PLAYER_HEIGHT = 30;
        let player = { x: 80, y: 0, vx: 0, vy: 0, width: PLAYER_WIDTH, height: PLAYER_HEIGHT, grounded: false, facingRight: true };
        
        const GRAVITY = 0.65; 
        const JUMP_POWER = -12; 
        const WALK_ACC = 0.9;
        const MAX_SPEED = 5.5;
        const LEVEL_WIDTH = 8000; 
        
        let platforms = [];
        let coins = [];
        let enemies = [];
        let traps = []; 
        let cameraX = 0;
        
        let animationTimer = 0; 
        
        let leftPressed = false;
        let rightPressed = false;
        let jumpKeyPressed = false;
        let canJump = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 110; 
            scaleFactor = canvas.height / BASE_HEIGHT;
            buildLevel();
        }
        
        function buildLevel(){
            platforms = [];
            coins = [];
            enemies = [];
            traps = [];
            const groundY = BASE_HEIGHT - 32;
            
            // Основная земля
            platforms.push({ x: 0, y: groundY, w: 1000, h: 32, type: 'ground' });
            platforms.push({ x: 1150, y: groundY, w: 1000, h: 32, type: 'ground' });
            platforms.push({ x: 2300, y: groundY, w: 1200, h: 32, type: 'ground' });
            platforms.push({ x: 3700, y: groundY, w: 1100, h: 32, type: 'ground' });
            platforms.push({ x: 5000, y: groundY, w: 1300, h: 32, type: 'ground' });
            platforms.push({ x: 6550, y: groundY, w: 1500, h: 32, type: 'ground' });
            
            // Статические островки
            platforms.push({ x: 250, y: groundY - 60, w: 90, h: 18 });
            platforms.push({ x: 420, y: groundY - 110, w: 90, h: 18 });
            platforms.push({ x: 1350, y: groundY - 70, w: 120, h: 18 });
            platforms.push({ x: 2450, y: groundY - 65, w: 140, h: 18 });
            platforms.push({ x: 3950, y: groundY - 80, w: 120, h: 18 });
            platforms.push({ x: 5200, y: groundY - 75, w: 140, h: 18 });

            // МЕХАНИЗМЫ: Горизонтальные платформы
            platforms.push({ x: 1020, y: groundY - 50, w: 100, h: 16, isMoving: true, moveType: 'horizontal', startX: 1020, range: 110, speed: 1.5, direction: 1 });
            platforms.push({ x: 3520, y: groundY - 60, w: 110, h: 16, isMoving: true, moveType: 'horizontal', startX: 3520, range: 140, speed: 1.8, direction: 1 });
            platforms.push({ x: 6330, y: groundY - 50, w: 120, h: 16, isMoving: true, moveType: 'horizontal', startX: 6330, range: 180, speed: 1.6, direction: 1 });

            // МЕХАНИЗМЫ: Вертикальные платформы
            platforms.push({ x: 700, y: groundY - 140, w: 90, h: 16, isMoving: true, moveType: 'vertical', startY: groundY - 140, range: 100, speed: 1.2, direction: 1 });
            platforms.push({ x: 1700, y: groundY - 130, w: 90, h: 16, isMoving: true, moveType: 'vertical', startY: groundY - 130, range: 110, speed: 1.4, direction: 1 });
            platforms.push({ x: 2850, y: groundY - 150, w: 100, h: 16, isMoving: true, moveType: 'vertical', startY: groundY - 150, range: 110, speed: 1.3, direction: 1 });
            platforms.push({ x: 4830, y: groundY - 140, w: 90, h: 16, isMoving: true, moveType: 'vertical', startY: groundY - 140, range: 100, speed: 1.5, direction: 1 });
            platforms.push({ x: 6050, y: groundY - 150, w: 100, h: 16, isMoving: true, moveType: 'vertical', startY: groundY - 150, range: 110, speed: 1.3, direction: 1 });

            // Звезды
            function addCoin(xx, yy){ coins.push({ x: xx, y: yy, w: 14, h: 14, collected: false }); }
            const coinPositions = [
                [280, groundY-95], [450, groundY-145], [1400, groundY-110], [2500, groundY-100],
                [4000, groundY-120], [5250, groundY-110], [150, groundY-40], [1350, groundY-40],
                [2700, groundY-40], [4100, groundY-40], [5500, groundY-40], [7000, groundY-40]
            ];
            coinPositions.forEach(p => addCoin(p[0], p[1]));

            // Монстры
            function addEnemy(xx, yy, type, range) { 
                enemies.push({ 
                    x: xx, y: yy, w: 30, h: 30, 
                    direction: 1, speed: 1.3, 
                    animType: type, phase: Math.random() * 10,
                    startX: xx, rangeX: range 
                }); 
            }
            addEnemy(450, groundY - 30, 0, 140);
            addEnemy(1500, groundY - 30, 1, 180);
            addEnemy(2600, groundY - 30, 0, 220);
            addEnemy(4200, groundY - 30, 1, 160);
            addEnemy(5600, groundY - 30, 0, 200);
            addEnemy(7100, groundY - 30, 1, 250);

            // Шипы
            function addTrap(xx, yy, ww) { traps.push({ x: xx, y: yy, w: ww, h: 16 }); }
            addTrap(600, groundY, 70);       
            addTrap(1850, groundY, 70);     
            addTrap(3100, groundY, 80);     
            addTrap(4450, groundY, 70);     
            addTrap(5800, groundY, 80);    
            addTrap(7450, groundY, 90);    
            
            player.x = 80;
            player.y = platforms[0].y - PLAYER_HEIGHT;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
        }
        
        function updateMechanisms() {
            for (let plat of platforms) {
                if (plat.isMoving) {
                    if (plat.moveType === 'horizontal') {
                        plat.x += plat.speed * plat.direction;
                        if (plat.x > plat.startX + plat.range) { plat.x = plat.startX + plat.range; plat.direction = -1; }
                        if (plat.x < plat.startX) { plat.x = plat.startX; plat.direction = 1; }
                    } else if (plat.moveType === 'vertical') {
                        plat.y += plat.speed * plat.direction;
                        if (plat.y > plat.startY + plat.range) { plat.y = plat.startY + plat.range; plat.direction = -1; }
                        if (plat.y < plat.startY) { plat.y = plat.startY; plat.direction = 1; }
                    }
                }
            }
        }
        
        function applyCollision(){
            player.vy += GRAVITY;
            player.x += player.vx;
            
            // Проверка горизонтальных коллизий (стены)
            for(let plat of platforms){
                if(player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                   player.y + player.height > plat.y + 4 && player.y < plat.y + plat.h - 4){
                    if(player.vx > 0) player.x = plat.x - player.width;
                    else if(player.vx < 0) player.x = plat.x + plat.w;
                    player.vx = 0;
                }
            }
            
            player.y += player.vy;
            player.grounded = false;
            
            // Проверка вертикальных коллизий (пол/потолок)
            for(let plat of platforms){
                if(player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                   player.y + player.height > plat.y && player.y < plat.y + plat.h){
                    
                    if(player.vy >= 0 && (player.y + player.height - player.vy) <= plat.y + 14){
                        player.y = plat.y - player.height;
                        
                        // Если платформа движется, привязываем игрока к её циклу движения
                        if (plat.isMoving) {
                            if (plat.moveType === 'horizontal') {
                                player.x += plat.speed * plat.direction;
                            } else if (plat.moveType === 'vertical') {
                                player.y += plat.speed * plat.direction;
                            }
                        }
                        
                        player.vy = 0;
                        player.grounded = true;
                    } 
                    else if(player.vy < 0 && (player.y - player.vy) >= plat.y + plat.h - 10){
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    }
                }
            }

            if (gameRunning) {
                for (let trap of traps) {
                    if (player.x < trap.x + trap.w && player.x + player.width > trap.x &&
                        player.y + player.height > trap.y - 2 && player.y < trap.y + trap.h) {
                        loseLife();
                        break;
                    }
                }
            }
            
            if(player.x < 10) player.x = 10;
            if(player.x + player.width > LEVEL_WIDTH - 10) player.x = LEVEL_WIDTH - player.width;
            if(player.y > BASE_HEIGHT + 60) loseLife();
        }
        
        function updateEnemies(){
            for(let i=0; i<enemies.length; i++){
                const e = enemies[i];
                e.x += e.direction * e.speed;
                
                if (e.x > e.startX + e.rangeX) { e.x = e.startX + e.rangeX; e.direction = -1; } 
                else if (e.x < e.startX) { e.x = e.startX; e.direction = 1; }
                
                if(gameRunning && player.x < e.x + e.w && player.x + player.width > e.x &&
                   player.y < e.y + e.h && player.y + player.height > e.y){
                    if(player.vy > 0 && player.y + player.height - player.vy <= e.y + 12){
                        enemies.splice(i,1); i--; player.vy = -9; score += 2; updateUI();
                    } else { loseLife(); }
                }
            }
        }
        
        function updateCoins(){
            for(let i=0; i<coins.length; i++){
                const c = coins[i];
                if(!c.collected && player.x < c.x + c.w && player.x + player.width > c.x &&
                   player.y < c.y + c.h && player.y + player.height > c.y){
                    c.collected = true; score++; updateUI();
                }
            }
        }
        
        function loseLife(){
            if(!gameRunning) return;
            lives--; updateUI();
            if(lives <= 0){ gameRunning = false; } 
            else {
                buildLevel();
                leftPressed = false; rightPressed = false; jumpKeyPressed = false; canJump = true; cameraX = 0;
            }
        }
        
        function restartGame(){
            gameRunning = true; lives = 3; score = 0;
            buildLevel(); updateUI();
            leftPressed = false; rightPressed = false; jumpKeyPressed = false; canJump = true; cameraX = 0;
        }
        
        function updateUI(){
            document.getElementById('coinCounter').innerText = score;
            document.getElementById('livesCounter').innerText = lives;
        }
        
        function handleInput(){
            if(!gameRunning) return;
            if(leftPressed){ player.vx = Math.max(-MAX_SPEED, player.vx - WALK_ACC); player.facingRight = false; }
            if(rightPressed){ player.vx = Math.min(MAX_SPEED, player.vx + WALK_ACC); player.facingRight = true; }
            if(!leftPressed && !rightPressed){ player.vx *= 0.85; if(Math.abs(player.vx) < 0.05) player.vx = 0; }
            if(jumpKeyPressed && player.grounded && canJump){ player.vy = JUMP_POWER; player.grounded = false; canJump = false; }
        }
        
        function updateCamera(){
            let virtualWidth = canvas.width / scaleFactor;
            let targetX = player.x + player.width/2 - virtualWidth/2;
            targetX = Math.min(targetX, LEVEL_WIDTH - virtualWidth);
            targetX = Math.max(targetX, 0);
            cameraX = targetX;
        }
        
        function drawSkin(ctx, x, y, facingRight, skinId){
            let walkBob = 0;
            if ((leftPressed || rightPressed) && player.grounded) {
                walkBob = Math.sin(animationTimer * 0.3) * 2; 
            }
            y += walkBob;

            if(skinId === 5){  
                ctx.fillStyle = "#f3ccb0"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#1a1310"; ctx.fillRect(x+2, y-3, PLAYER_WIDTH-4, 8);
                ctx.fillRect(x+3, y+4, 6, 4); ctx.fillRect(x+11, y+4, 12, 3); ctx.fillRect(x+21, y+4, 6, 4);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 11);
                ctx.fillStyle = "#e6e6e6"; ctx.fillRect(x+7, y+16, 16, 3);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+4, y+27, 8, 4); ctx.fillRect(x+18, y+27, 8, 4);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+6, y+9, 5, 4); ctx.fillRect(x+19, y+9, 5, 4);
                ctx.fillStyle = "#1c120c"; ctx.fillRect(x+7+(facingRight?1:-1), y+10, 3, 3); ctx.fillRect(x+20+(facingRight?1:-1), y+10, 3, 3);
                return;
            }
            if(skinId === 6){  
                ctx.fillStyle = "#fcd0b0"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#80593f"; ctx.fillRect(x+1, y-4, PLAYER_WIDTH-2, 9); 
                ctx.fillStyle = "#9c7459"; ctx.fillRect(x+3, y+2, 8, 4); ctx.fillRect(x+13, y+1, 10, 5);
                ctx.fillStyle = "#141416"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+2, y+18, 3, 2); ctx.fillRect(x+14, y+17, 2, 4); ctx.fillRect(x+22, y+20, 5, 2);
                ctx.fillStyle = "#404045"; ctx.fillRect(x+13, y+16, 4, 12);
                ctx.fillStyle = "#0c0c0e"; ctx.fillRect(x+3, y+28, 8, 3); ctx.fillRect(x+19, y+28, 8, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+5, y+9, 5, 4); ctx.fillRect(x+19, y+9, 5, 4);
                ctx.fillStyle = "#467285"; ctx.fillRect(x+6+(facingRight?1:0), y+10, 3, 3); ctx.fillRect(x+20+(facingRight?1:0), y+10, 3, 3);
                return;
            }
            if(skinId === 7){  
                ctx.fillStyle = "#fad1b0"; ctx.fillRect(x+4, y+4, PLAYER_WIDTH-8, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#5c4033"; ctx.fillRect(x+2, y-4, PLAYER_WIDTH-4, 9);
                ctx.fillStyle = "#2b5c8f"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#6ca0dc"; ctx.fillRect(x+13, y+10, 4, 2);
                return;
            }
            if(skinId === 8){  
                ctx.fillStyle = "#ebd0b9"; ctx.fillRect(x+3, y+4, PLAYER_WIDTH-6, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+1, y-3, PLAYER_WIDTH-2, 8);
                ctx.fillRect(x+2, y+5, 7, 6); ctx.fillRect(x+21, y+5, 7, 6);
                ctx.fillStyle = "#1c1c1e"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#2c3539"; ctx.fillRect(x+4, y+28, 7, 3); ctx.fillRect(x+19, y+28, 7, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+5, y+10, 5, 4); ctx.fillRect(x+20, y+10, 5, 4);
                ctx.fillStyle = "#221915"; ctx.fillRect(x+6, y+11, 3, 3); ctx.fillRect(x+21, y+11, 3, 3);
                return;
            }
            if(skinId === 9){  
                ctx.fillStyle = "#fcdcb5"; ctx.fillRect(x+2, y+4, PLAYER_WIDTH-4, PLAYER_HEIGHT-4);
                ctx.fillStyle = "#2d2522"; ctx.fillRect(x+1, y-3, PLAYER_WIDTH-2, 8);
                ctx.fillStyle = "#1f2421"; ctx.fillRect(x, y+16, PLAYER_WIDTH, 12);
                ctx.fillStyle = "#111"; ctx.fillRect(x+3, y+28, 8, 3); ctx.fillRect(x+19, y+28, 8, 3);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(x+4, y+9, 8, 6); ctx.fillRect(x+18, y+9, 8, 6);
                ctx.fillStyle = "#111111"; ctx.fillRect(x+6+(facingRight?1:-1), y+11, 3, 3); ctx.fillRect(x+20+(facingRight?1:-1), y+11, 3, 3);
                ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.strokeRect(x+3, y+8, 9, 8); ctx.strokeRect(x+17, y+8, 9, 8);
                ctx.fillStyle = "#000"; ctx.fillRect(x+12, y+11, 6, 2);
                return;
            }
        }
        
        function draw(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.scale(scaleFactor, scaleFactor);
            
            ctx.fillStyle = "#6cbce2"; 
            ctx.fillRect(0, 0, canvas.width / scaleFactor, BASE_HEIGHT);
            
            ctx.fillStyle = "#fcf9ee";
            for(let i=0; i<35; i++){ 
                ctx.fillRect(80 + i * 300 - cameraX * 0.2, 25 + (i % 4) * 20, 80, 30); 
            }
            
            for(let plat of platforms){
                let dx = plat.x - cameraX;
                if(plat.isMoving) {
                    ctx.fillStyle = "#e67e22"; ctx.fillRect(dx, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#d35400"; ctx.fillRect(dx, plat.y, plat.w, 3);
                } else if(plat.type === 'ground'){
                    ctx.fillStyle = "#735135"; ctx.fillRect(dx, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#4fa745"; ctx.fillRect(dx, plat.y, plat.w, 6);
                } else {
                    ctx.fillStyle = "#b36b39"; ctx.fillRect(dx, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#ffaa66"; ctx.fillRect(dx, plat.y, plat.w, 3);
                }
            }

            for(let trap of traps) {
                let dx = trap.x - cameraX;
                ctx.fillStyle = "#444"; 
                ctx.fillRect(dx, trap.y - 3, trap.w, 4);
                
                ctx.fillStyle = "#cccccc"; 
                let spikeWidth = 10;
                let spikeCount = trap.w / spikeWidth;
                for(let j = 0; j < spikeCount; j++) {
                    ctx.beginPath();
                    ctx.moveTo(dx + (j * spikeWidth), trap.y - 3);
                    ctx.lineTo(dx + (j * spikeWidth) + (spikeWidth / 2), trap.y - 14); 
                    ctx.lineTo(dx + ((j + 1) * spikeWidth), trap.y - 3);
                    ctx.fill();
                }
            }
            
            for(let c of coins){
                if(c.collected) continue;
                let dx = c.x - cameraX;
                ctx.fillStyle = "#FFD966"; ctx.beginPath(); ctx.ellipse(dx+7, c.y+7, 7, 7, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#b8860b"; ctx.font = "bold 11px monospace"; ctx.fillText("★", dx+3, c.y+11);
            }
            
            for(let e of enemies){
                let dx = e.x - cameraX;
                let dy = e.y;
                
                let pulse = Math.sin(animationTimer * 0.15 + e.phase) * 3;
                let sizeMod = Math.cos(animationTimer * 0.1 + e.phase) * 1.5;

                if (e.animType === 0) {
                    ctx.fillStyle = "#8d42b5"; 
                    ctx.fillRect(dx, dy + pulse, e.w, e.h - pulse);
                    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(dx + 15, dy + 10 + pulse, 6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.arc(dx + 15, dy + 10 + pulse, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#1d1a39"; ctx.fillRect(dx + 8, dy + 20 + pulse, 14, 3);
                } else {
                    ctx.fillStyle = "#c13636"; 
                    ctx.fillRect(dx - sizeMod/2, dy - sizeMod/2, e.w + sizeMod, e.h + sizeMod);
                    ctx.fillStyle = "#4a0e17";
                    ctx.fillRect(dx - 4 - sizeMod/2, dy + 4, 4, 6);
                    ctx.fillRect(dx + e.w + sizeMod/2, dy + 4, 4, 6);
                    ctx.fillStyle = "#fff"; 
                    ctx.fillRect(dx + 3, dy + 6, 7, 3); ctx.fillRect(dx + 18, dy + 6, 7, 3);
                    ctx.fillStyle = "#000";
                    ctx.fillRect(dx + 6, dy + 6, 2, 3); ctx.fillRect(dx + 19, dy + 6, 2, 3);
                    ctx.fillStyle = "#fff"; ctx.fillRect(dx + 6, dy + 16, 16, 5);
                    ctx.fillStyle = "#000"; ctx.fillRect(dx + 9, dy + 18, 2, 3); ctx.fillRect(dx + 15, dy + 18, 2, 3);
                }
            }
            
            let px = player.x - cameraX; 
            drawSkin(ctx, px, player.y, player.facingRight, currentSkin);
            
            let fx = LEVEL_WIDTH - 150 - cameraX;
            ctx.fillStyle = "#333"; ctx.fillRect(fx, BASE_HEIGHT - 122, 5, 90);
            ctx.fillStyle = "#4caf50"; ctx.fillRect(fx + 5, BASE_HEIGHT - 122, 35, 22); 
            ctx.fillStyle = "#fff"; ctx.font = "bold 10px monospace"; ctx.fillText("GOAL", fx + 7, BASE_HEIGHT - 108);
            
            if(!gameRunning && lives <= 0){
                let vw = canvas.width / scaleFactor;
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, vw, BASE_HEIGHT);
                ctx.font = "bold 26px monospace"; ctx.fillStyle = "#FFD966"; ctx.fillText("ИГРА ОКОНЧЕНА", vw/2 - 100, BASE_HEIGHT/2 - 15);
                ctx.font = "14px monospace"; ctx.fillStyle = "white"; ctx.fillText("Нажмите кнопку 'СНАЧАЛА'", vw/2 - 95, BASE_HEIGHT/2 + 20);
            }
            
            ctx.restore();
        }
        
        function takeScreenshot(){
            const link = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
            link.download = `super_jump_${currentSkin}_${timestamp}.png`;
            link.href = canvas.toDataURL(); link.click();
        }
        
        function gameLoop(){
            animationTimer++; 
            
            if(gameRunning){
                handleInput(); 
                updateMechanisms(); 
                applyCollision(); 
                updateEnemies(); 
                updateCoins(); 
                updateCamera();
                
                if(player.x >= LEVEL_WIDTH - 160){
                    gameRunning = false;
                    alert(`🎉 КАРТА УСПЕШНО ПРОЙДЕНА!\nВы добрались до финиша!\nСобрано звёзд: ${score}.`);
                }
            }
            draw(); requestAnimationFrame(gameLoop);
        }
        
        function init(){
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 250); });
            resizeCanvas(); 
            
            const setupTouchButton = (element, pressCallback, releaseCallback) => {
                element.addEventListener('touchstart', (e) => { pressCallback(); e.preventDefault(); }, {passive: false});
                element.addEventListener('touchend', (e) => { releaseCallback(); e.preventDefault(); }, {passive: false});
                element.addEventListener('mousedown', (e) => { pressCallback(); });
                element.addEventListener('mouseup', (e) => { releaseCallback(); });
            };

            setupTouchButton(document.getElementById('btnLeft'), () => { leftPressed = true; }, () => { leftPressed = false; });
            setupTouchButton(document.getElementById('btnRight'), () => { rightPressed = true; }, () => { rightPressed = false; });
            setupTouchButton(document.getElementById('btnJump'), () => { jumpKeyPressed = true; }, () => { jumpKeyPressed = false; canJump = true; });

            document.getElementById('btnRestart').addEventListener('click', restartGame);
            document.getElementById('btnScreenshot').addEventListener('click', takeScreenshot);
            
            const skinBtns = document.querySelectorAll('.skin-btn');
            skinBtns.forEach((btn) => {
                const select = (e) => {
                    currentSkin = parseInt(btn.dataset.skin);
                    skinBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if(e) e.preventDefault();
                };
                btn.addEventListener('click', select);
                btn.addEventListener('touchstart', select, {passive: false});
            });
            
            document.addEventListener('keydown', function(e) {
                if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
                if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
                if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') jumpKeyPressed = true;
            });
            document.addEventListener('keyup', function(e) {
                if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
                if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
                if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { jumpKeyPressed = false; canJump = true; }
            });
            
            gameLoop();
        }
        
        init();
    })();
</script>
</body>
</html>
